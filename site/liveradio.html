  <div class="container" id="streamPanel" style="margin-bottom:24px;">
    <h1 style="margin-bottom:8px;font-size:2em;text-align:center;">Jay Sands OnAir</h1>
    <div id="liveBadge" style="text-align:center;margin-bottom:16px;font-family:'Dancing Script',cursive;font-size:1.3em;">
      <span id="liveDot" style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#666;margin-right:8px;vertical-align:middle;"></span>
      <span id="liveStatusText">Checking stream…</span>
    </div>
    <div style="text-align:center;">
      <audio id="streamAudio" controls preload="none" style="width:100%;max-width:400px;">
        <source src="https://us-01.unitystreams.net:8026/live" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>
    <p style="text-align:center;color:#ccc;font-size:0.95em;margin-top:10px;font-family:'Georgia',serif;">
      Press play any time, if Jay isn't live, you'll just hear silence. Check back during show hours!
    </p>
  </div>

<script>
(function() {
  const dot = document.getElementById('liveDot');
  const statusText = document.getElementById('liveStatusText');

  function setStatus(isLive) {
    if (isLive) {
      dot.style.background = '#00ff9d';
      dot.style.boxShadow = '0 0 8px #00ff9d';
      statusText.textContent = 'LIVE NOW';
    } else {
      dot.style.background = '#666';
      dot.style.boxShadow = 'none';
      statusText.textContent = 'Offline, check back during show hours';
    }
  }
var streamAudio = document.getElementById('streamAudio');
streamAudio.addEventListener('playing', function() { setStatus(true); });
streamAudio.addEventListener('pause', function() { setStatus(false); });
streamAudio.addEventListener('waiting', function() { setStatus(false); });
streamAudio.addEventListener('stalled', function() { setStatus(false); });
streamAudio.addEventListener('ended', function() { setStatus(false); });
setStatus(false);

})();
</script>
